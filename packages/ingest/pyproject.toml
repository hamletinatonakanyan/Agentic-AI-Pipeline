[project]
name = "ingest"
version = "0.1.0"
description = "Parse files, chunk them, embed them, and store them in Qdrant, idempotently."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "observability",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.uv.sources]
common = { workspace = true }
observability = { workspace = true }
