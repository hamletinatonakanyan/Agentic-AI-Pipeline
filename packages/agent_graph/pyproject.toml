[project]
name = "agent_graph"
version = "0.1.0"
description = "The agent: a LangGraph graph that routes, retrieves, calls tools, answers and checks itself, with memory."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "observability",
    "llm",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1",
    "fastembed>=0.5",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_graph"]

[tool.uv.sources]
common = { workspace = true }
observability = { workspace = true }
llm = { workspace = true }
