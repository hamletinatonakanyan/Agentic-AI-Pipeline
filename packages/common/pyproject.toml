[project]
name = "common"
version = "0.1.0"
description = "Shared infrastructure: settings base, error envelope, logging, access-key check, UI kit. No domain logic."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
