[project]
name = "evals"
version = "0.1.0"
description = "Measure retrieval and answer quality against a golden dataset, and compare runs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "observability",
    "llm",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "qdrant-client>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]

[tool.uv.sources]
common = { workspace = true }
observability = { workspace = true }
llm = { workspace = true }
