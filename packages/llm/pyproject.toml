[project]
name = "llm"
version = "0.1.0"
description = "The one LLM adapter: OpenAI gpt-6-luna through the Responses API. A shared library, no UI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "observability",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[tool.uv.sources]
common = { workspace = true }
observability = { workspace = true }
