[project]
name = "retrieval"
version = "0.1.0"
description = "Find the best chunks for a question: dense, sparse or hybrid search, query rewriting, reranking."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "observability",
    "llm",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "qdrant-client>=1.12",
    "fastembed>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]

[tool.uv.sources]
common = { workspace = true }
observability = { workspace = true }
llm = { workspace = true }
