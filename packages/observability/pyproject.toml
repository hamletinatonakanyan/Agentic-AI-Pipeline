[project]
name = "observability"
version = "0.1.0"
description = "Tracing API (spans), a local SQLite trace store, and trace endpoints. Safe no-op when off."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability"]

[tool.uv.sources]
common = { workspace = true }
