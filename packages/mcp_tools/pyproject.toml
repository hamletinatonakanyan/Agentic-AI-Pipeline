[project]
name = "mcp_tools"
version = "0.1.0"
description = "An MCP server with our own tools, and a safe client that discovers and calls tools from MCP servers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "observability",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "httpx2>=2",
    "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tools"]

[tool.uv.sources]
common = { workspace = true }
observability = { workspace = true }
