[project]
name = "e2e"
version = "0.1.0"
description = "The end-to-end app: mounts every package's API and UI, plus the chat."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "observability",
    "ingest",
    "llm",
    "retrieval",
    "evals",
    "mcp_tools",
    "agent_graph",
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2e"]

[tool.uv.sources]
common = { workspace = true }
observability = { workspace = true }
ingest = { workspace = true }
llm = { workspace = true }
retrieval = { workspace = true }
evals = { workspace = true }
mcp_tools = { workspace = true }
agent_graph = { workspace = true }
