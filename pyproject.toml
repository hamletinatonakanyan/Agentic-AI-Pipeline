[project]
name = "agentic-blocks"
version = "0.1.0"
description = "Workspace root for the agentic building blocks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "common",
    "observability",
    "llm",
    "retrieval",
    "evals",
    "mcp_tools",
    "agent_graph",
    "ingest",
    "e2e",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

# Workspace members: every package under packages/, plus the e2e app.
[tool.uv.workspace]
members = ["packages/*", "e2e"]

[tool.uv.sources]
common = { workspace = true }
observability = { workspace = true }
llm = { workspace = true }
retrieval = { workspace = true }
evals = { workspace = true }
mcp_tools = { workspace = true }
agent_graph = { workspace = true }
ingest = { workspace = true }
e2e = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages", "e2e"]
# Test file names must be unique across the repo (default import mode has no per-package
# namespaces). Do not switch to --import-mode=importlib: it names modules after their path, so
# e2e/tests/... creates a fake top-level `e2e` module that shadows the real e2e package.
addopts = "-m 'not live and not integration'"
filterwarnings = [
    "ignore:Payload indexes have no effect:UserWarning",  # qdrant-client local mode
]
markers = [
    "live: needs network and keys, or downloads models (OpenAI, LlamaParser, fastembed). Run explicitly with `make test-live`.",
    "integration: needs Qdrant running in Docker.",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501", "UP031"]  # long fixture lines and the %-formatted PDF builder

[tool.ruff.lint.isort]
known-first-party = ["common", "e2e", "observability", "ingest", "llm", "retrieval", "evals", "mcp_tools", "agent_graph"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` in argument defaults is the intended pattern.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]
